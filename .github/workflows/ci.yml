# Continuous integration: lint, type-check, tests and build on every push and pull request (SDD 8.1).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Page size budget (NFR-02, 250 kB gzipped per page)
        run: pnpm size

      - name: Install Playwright browsers (Chrome, Firefox, Edge – NFR-16)
        run: pnpm --filter @venzini/e2e exec playwright install --with-deps chromium firefox msedge

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
